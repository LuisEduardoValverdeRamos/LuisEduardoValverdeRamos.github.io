  profile = "Political scientist trained at PUCP, where he graduated first in his class; his licentiate thesis received a distinction (mención sobresaliente). His research covers electoral behaviour and implementation gaps in public infrastructure, combining mixed methods and computational social science in R. Researcher at the Electoral and Governance School (ESEG) of Peru's National Elections Jury, consultant to the Corruption Observatory of the Lima Bar Association and Director General of the Peruvian National Schools Debate Team."

