# CV page (/cv/): both versions of the CV as PDFs, each with its thumbnail
# and its button. The CV is written in LaTeX (tools/cv/cv-es.tex and
# cv-en.tex) and published with tools/cv/build.py, which also records the
# pages and date of each PDF in data/cvfiles.toml.
# No phone number, address, ID number or references (references on request).
# Top-level keys first: in TOML, anything below a table header belongs to it.

title = "Curriculum vitae"
lead = "My CV in English and Spanish."
meta = "PDF · updated %s"
view = "Open in the browser"
refs = "References on request:"

# One card per language, in this order
[[files]]
  lang = "en"
  name = "English"
  download = "Download in English"
[[files]]
  lang = "es"
  name = "Español"
  download = "Download in Spanish"
