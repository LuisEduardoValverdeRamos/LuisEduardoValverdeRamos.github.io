# Debate page (/debate/). Team results are labelled as the team's («the team I
# coached», «the pairs I prepared»); MED and CMUDE are spelled out; nothing
# individual about school debaters (they are minors).
# Luis's corrections (17 Oct 2026): he did not coach teams at WUDC, only at
# CMUDE, and he was never Academic Director of the LPDE (consultant, Feb–Aug 2026).
# Luis's corrections (18 Oct 2026): the national squad works with a coaching staff
# and each coach prepares one of the delegation's teams (his team: quarterfinals in
# Panama 2026, its three debaters among the top speakers; he also coached for MED
# Chile 2025); he is CO-head coach of the PUCP Debate Society; judging alone does
# not sell — what positions him is serving on adjudication teams of school and
# university tournaments in Costa Rica, Ecuador, Peru and Venezuela; in 2025 he
# prepared the first all-Dominican pair to reach the round of 16 at CMUDE.
# Top-level keys first: in TOML, anything below a table header belongs to it.

lead = "I lead the Peruvian National Schools Debate Team, coach school and university teams and have served on adjudication teams at tournaments in Costa Rica, Ecuador, Peru and Venezuela."

# Home page: a one-line band, apart from the research and consulting
# profile: the organisations of the [coach] roles marked home = true.
[home]
  title = "Debate"
  more = "See debate"

# Page: the director role is set apart at the top (wording confirmed by Luis on
