# Debate page (/debate/). Team results are labelled as the team's («the team I
# coached», «the pairs I prepared»); MED, CMUDE and WUDC are spelled out; nothing
# individual about school debaters (they are minors).
# Top-level keys first: in TOML, anything below a table header belongs to it.

lead = "I coach school and university teams, adjudicate tournaments held in Spanish and lead the academic team of the Peruvian School Debate League (LPDE)."
glossary = "MED is the Mundial de Debate Escolar en Español, the world schools championship held in Spanish; CMUDE is the world universities championship held in Spanish; WUDC is the World Universities Debating Championship, held in English."

