[[projects]]
  area = "Policy implementation"
  title = "Disaster Reconstruction and Implementation Gaps in Peru"
  description = "Licentiate thesis with distinction (mención sobresaliente). Examined the reconstruction of school infrastructure in Piura (July 2020 – January 2023) after the 2017 coastal El Niño, analysing the factors behind implementation gaps in post-disaster public works."
  tech = "R, Process Tracing, Qualitative Comparative Analysis, Public Policy"
  image = "/images/projects/disaster-reconstruction.jpg"
  link = "https://hdl.handle.net/20.500.12404/32370"

