[[lines]]
  id = "electoral-behaviour"
  name = "Electoral behaviour"
  question = "How do people vote in weak party systems?"
  summary = "Post-election surveys, clustering and discrete-choice models. I was part of the technical team behind the JNE/ProDiálogo report on the Peruvian voter (2026)."
  method = "JNE post-election surveys (2011, 2016 and 2021), cluster analysis, discrete-choice models and spatial analysis of the voter register."
  evidence = "JNE/ProDiálogo report (2026), as part of the technical team; Youth Vote 2026 project."

[[lines]]
  id = "implementation"
  name = "Policy implementation"
  question = "What explains implementation gaps in public policy?"
  summary = "My thesis examined the reconstruction of school infrastructure in Piura after the 2017 coastal El Niño (2020–2023). As a research assistant at Q-LAB-PUCP, I worked on a machine-learning model of delays in municipal public works."
  method = "Case study with comparison and interviews (thesis); a machine-learning model (XGBoost and SHAP) of municipal works, as a research assistant at Q-LAB-PUCP."
  evidence = "Licentiate thesis with distinction (PUCP, 2025); public site and code of the municipal works project."

[[lines]]
  id = "legislative-analysis"
  name = "Legislative behaviour"
  question = "How do legislators and their blocs vote in Peru's Congress?"
  summary = "A line in development: I study the behaviour of parliamentary blocs and the higher-education and mining reforms in Congress. For the civic portal hechosynopalabras.pe (GIES-PUCP) I systematised roll-call votes and bill tracking."
  method = "Scraping and systematisation of bills and roll-call votes of Peru's Congress (2021–2026); documented databases and analysis in R."
  evidence = "Civic portal hechosynopalabras.pe, by the State and Society Research Group (GIES-PUCP)."
  status = "In development"

