[[lines]]
  id = "electoral-behaviour"
  name = "Electoral behaviour"
  question = "How do people vote in the absence of parties?"
  summary = "Post-election surveys, clustering and discrete-choice models. I was part of the technical team behind the JNE/ProDiálogo report on the Peruvian voter (2026), and I am preparing an article with Daniel Encinas (Northwestern University)."
  method = "JNE post-election surveys (2011, 2016 and 2021), cluster analysis, discrete-choice models and spatial analysis of the voter register."
  evidence = "JNE/ProDiálogo report (2026), as part of the technical team; Youth Vote 2026 project; article in preparation with Daniel Encinas."
  status = "Active"

[[lines]]
  id = "press-and-agenda"
  name = "The press and the public agenda"
  question = "What does the press choose to name, and what does it leave out?"
  summary = "As a research assistant at CISEPA-PUCP, I helped build a corpus of 747,836 headlines from El Comercio and La República (2016–2024). This line is in development."
  method = "Text analysis at scale on a corpus of 747,836 headlines from El Comercio and La República (2016–2024), built as a research assistant at CISEPA-PUCP."
  evidence = "No publications of my own yet."
  status = "In development"

[[lines]]
  id = "implementation"
  name = "Policy implementation"
  question = "Why do the works the state promises arrive late, or not at all?"
  summary = "My thesis examined the reconstruction of school infrastructure in Piura after the 2017 coastal El Niño (2020–2023). As a research assistant at Q-LAB-PUCP, I worked on a machine-learning model of delays in municipal public works."
  method = "Case study with comparison and interviews (thesis); a machine-learning model (XGBoost and SHAP) of municipal works, as a research assistant at Q-LAB-PUCP."
  evidence = "Licentiate thesis with distinction (PUCP, 2025); public site and code of the municipal works project."
  status = "Active"

[[lines]]
  id = "civic-education"
  name = "Civic education and debate"
  question = "What prepares citizens to deliberate?"
  summary = "For the LPDE, I analysed public results from school debate tournaments, in aggregate only (2026). For the ESEG, I work on a census of electoral education in Peruvian universities (ongoing)."
  method = "Analysis of public results from school tournaments, always in aggregate; census of electoral education in universities (ESEG-JNE)."
  evidence = "LPDE report and policy briefs (2026). The ESEG census is ongoing and has no publishable results yet."
  status = "Active"

