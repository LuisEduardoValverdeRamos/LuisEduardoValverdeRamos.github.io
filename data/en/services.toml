  for = "For"
  format = "Format"
  deliverables = "Deliverables"
  proof = "Track record"
  write = "Email about this"
  subject = "Subject"
  nopromise = "What I don't promise"
  pillar_proof = "Track record"
  press = "Press enquiries"

[home]
  title = "What I can help with"
  more = "All services"
