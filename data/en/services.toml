# Work with me (/work-with-me/): the English mirror of the Spanish page, from
# the same structure. Three pillars, in this order: research, debate and
# consulting (R workshops, press, "How I work", "What I don't do", the
# Deliverables, no-promise and per-service track-record rows and the
# methods-review card were removed on 28 Oct 2026; the debate pillar band and
# the institutions block carry the proof). A service or note with
# confirmar = "…" waits for Luis: it shows
# only in local previews, marked, and is never published in production.
# Top-level keys first: in TOML, anything below a table header belongs to it.

title = "How I can help"
lead = "Alongside my research, I take on projects in three areas. Email me with what you need."
router_label = "What do you need?"

[labels]
  for = "For"
  format = "Format"
  write = "Email about this"
  pillar_proof = "Track record"
  press = "Press enquiries"
  details = "Details"

[home]
  title = "What I can help with"
  more = "All services"
  pillars = ["consulting", "research", "debate"]

[[router]]
  label = "Collaborate on research"
  anchor = "research"
[[router]]
  label = "Prepare a debate team"
  anchor = "debate"
[[router]]
  label = "Analyse electoral or institutional data"
  anchor = "consulting"

[[pillars]]
  id = "research"
  name = "Research and papers"
  page = "/research"
  page_label = "My research"
  title = "Collaboration and research assistance"
  intro = "I collaborate on projects on electoral behaviour, subnational politics, policy implementation and legislative analysis in Peru and Latin America."
  limit = "I do not write theses, papers or assignments for others to submit as their own. I review, explain and teach; the text and the decisions belong to whoever signs them."
  home_title = "Research collaboration"
  home_text = "Co-authorship, research assistance, dataset building and methods support."
  home_cta = "Propose a collaboration"

  [[pillars.services]]
    title = "Collaboration and co-authorship"
    for = "Researchers working on Peru or Latin America on these topics."
    format = "Roles agreed at the start using the CRediT taxonomy: data curation, analysis, software, visualisation and writing."
    subject = "Research: collaboration or methods support"
    body = "Topic and question:\nStage of the project:\nData:\nThe role you have in mind for me:\n"

  [[pillars.services]]
    title = "Research assistance"
    for = "Researchers and centres that need datasets built, replicable econometric analysis in R or literature reviews."
    format = "By project, online."
    subject = "Research assistance"
    body = "Project and institution:\nTasks:\nHours per week and duration:\n"

[[pillars]]
  id = "debate"
  name = "Debate"
  page = "/debate"
  page_label = "My debate track record"
  title = "Team coaching and tournament advice"
  intro = "I coach school and university teams in World Schools and British Parliamentary formats, and I advise on tournament adjudication and organisation."
  proof = "Director General of the Peruvian National Schools Debate Team and previously part of its coaching staff: in Panama in 2026 the team won its fourth consecutive title at the Mundial de Debate Escolar en Español (MED), the world schools championship held in Spanish, and my team reached the quarterfinals. I prepared the Dominican pairs that reached the quarterfinals and the round of 16 of CMUDE Ecuador 2026."
  home_title = "Team coaching and tournament advice"
  home_text = "Schools, universities and national teams: team preparation and advice on tournament adjudication and organisation."
  home_cta = "Coach my team"

  [[pillars.services]]
    title = "Debate programme for schools"
    for = "Schools that want to start a debate club or prepare their team for school tournaments."
    format = "A term or year-long programme, in person in Lima or online; session frequency agreed with the school."
    subject = "Debate programme for a school"
    body = "School:\nCity:\nYear groups and number of students:\nDo you already have a debate club?:\nTournaments you are aiming for:\nFormat (in person or online):\nDesired start date:\n"

  [[pillars.services]]
    title = "University teams and argumentation workshops"
    for = "Debating societies and national teams preparing for a tournament, and schools, universities and organisations that want a practical introduction to debate."
    format = "A preparation cycle before the tournament, in British Parliamentary or World Schools format, or a two-hour workshop; in person in Lima or online."
    subject = "Debate coaching or argumentation workshop"
    body = "Institution or team:\nWhat you need (tournament preparation or a workshop):\nFormat (BP or World Schools):\nNumber of participants and level:\nDates and availability:\n"

  [[pillars.services]]
    title = "Advice on tournament adjudication and organisation"
    for = "Leagues, organisers, universities and schools preparing a tournament that want advice on its competitive side: the judging team, assessment criteria and how the rounds are organised."
    format = "Depending on the tournament: advice on designing the adjudication team and on the organisation, the two-hour workshop «How is a debate judged?» and a calibration session with sample rounds before the tournament."
    subject = "Debate tournament advice (adjudication and organisation)"
    body = "Organisation or tournament:\nTournament date:\nFormat:\nNumber of teams and adjudicators (and their experience):\n"

[[pillars]]
  id = "consulting"
  name = "Consulting and data analysis"
  title = "Applied research for institutions"
  intro = "I design and analyse studies for institutions with mixed methods, quantitative and qualitative, documenting every methodological decision."
  home_title = "Applied research for institutions"
  home_text = "Surveys, administrative records and interviews, with quantitative and qualitative methods."
  home_cta = "Email me about a project"

  [[pillars.services]]
    title = "Electoral and public-opinion analysis"
    for = "NGOs, research centres, international cooperation and newsrooms with a data unit."
    format = "Scope agreed at the start: from a one-off question about a dataset to a report with figures."
    subject = "Consulting: data analysis"
    body = "Organisation:\nWhat you need analysed or assessed:\nData available:\nDeadline:\n"

  [[pillars.services]]
    title = "Methods support and indicator validity"
    for = "Observatories, NGOs and research units about to publish indicators built from administrative data."
    format = "A review of the dataset and of each indicator, with working sessions with the team."
    subject = "Methods support - indicator validity"
    body = "Organisation:\nReport or indicators in preparation:\nData source:\nPlanned publication date:\n"

  [[pillars.services]]
    title = "Data and visualisation in R"
    for = "Teams working with records from MEF, INEI, MINEDU, SEACE or BCRP that need them integrated, documented and visualised."
    format = "Project-based deliverables. I work in R; I also use Python and Stata at an intermediate level."
    subject = "Data analysis and visualisation in R"
    body = "Organisation:\nData sources:\nWhat you need (dataset, figures, report):\nDeadline:\n"

[institutions]
  title = "Institutions I have worked with"
  home_label = "I have worked with"
  home_line = "JNE (ESEG) · PUCP (Q-LAB, CISEPA, IDEHPUCP) · ProDiálogo · Lima Bar Association (Corruption Observatory) · Peruvian School Debate League · Colegio Alpamayo · Roche Pharma Peru (through Sapienza Consultora)"
  [[institutions.groups]]
    label = "Employment and affiliation"
    text = "Jurado Nacional de Elecciones, Peru's National Elections Jury (ESEG) · Pontificia Universidad Católica del Perú (CISEPA, Q-LAB, GIES) · IDEHPUCP"
  [[institutions.groups]]
    label = "Consulting"
    text = "Corruption Observatory of the Lima Bar Association · ProDiálogo (commissioned by the JNE) · Peruvian School Debate League (LPDE) · Roche Pharma Peru (through Sapienza Consultora)"
  [[institutions.groups]]
    label = "Debate"
    text = "Peruvian National Schools Debate Team · PUCP Debate Society · Colegio Alpamayo · university teams from the Dominican Republic"

[contact]
  title = "Email me"
  text = "Tell me what you need and when you need it. Write to me in English or Spanish."
