# Work with me (/work-with-me/): the English mirror of the Spanish page, from
# the same structure. Three pillars, in this order: research, debate and
# consulting (R workshops, press, "How I work", "What I don't do", the
# Deliverables, no-promise and per-service track-record rows and the
# methods-review card were removed on 28 Oct 2026; the institutions block and
# the linked pages carry the proof). A service or note with
# confirmar = "…" waits for Luis: it shows
# only in local previews, marked, and is never published in production.
# Top-level keys first: in TOML, anything below a table header belongs to it.

title = "How I can help"
lead = "Alongside my research, I take on projects in three areas. Email me with what you need."
router_label = "What do you need?"

[labels]
  write = "Email about this"
  press = "Press enquiries"

[home]
  title = "What I can help with"
  more = "All services"
  pillars = ["consulting", "research", "debate"]

[[router]]
  label = "Collaborate on research"
  anchor = "research"
[[router]]
  label = "Prepare a debate team"
  anchor = "debate"
[[router]]
  label = "Analyse electoral or institutional data"
  anchor = "consulting"

[[pillars]]
  id = "research"
  name = "Research and papers"
  page = "/research"
  page_label = "My research"
  title = "Collaboration and research assistance"
  intro = "I collaborate on projects on electoral behaviour, subnational politics, policy implementation and legislative analysis in Peru and Latin America."
  home_title = "Research collaboration"
  home_text = "Co-authorship, research assistance, dataset building and methods support."
  home_cta = "Propose a collaboration"

  [[pillars.services]]
    title = "Collaboration and co-authorship"
    text = "Roles agreed at the start using the CRediT taxonomy."
    subject = "Research: collaboration or methods support"
    body = "Topic and question:\nStage of the project:\nData:\nThe role you have in mind for me:\n"

  [[pillars.services]]
    title = "Research assistance"
    text = "Documented datasets, replicable analysis in R and literature reviews, by project and online."
    subject = "Research assistance"
    body = "Project and institution:\nTasks:\nHours per week and duration:\n"

[[pillars]]
  id = "debate"
  name = "Debate"
  page = "/debate"
  page_label = "My debate track record"
  title = "Team coaching and tournament advice"
  intro = "I coach school and university teams in World Schools and British Parliamentary formats, and I advise on tournament adjudication and organisation."
  home_title = "Team coaching and tournament advice"
  home_text = "Schools, universities and national teams: team preparation and advice on tournament adjudication and organisation."
  home_cta = "Coach my team"

  [[pillars.services]]
    title = "Debate programme for schools"
    text = "A term or year-long programme to start a club or prepare for tournaments, in person in Lima or online."
    subject = "Debate programme for a school"
    body = "School:\nCity:\nYear groups and number of students:\nDo you already have a debate club?:\nTournaments you are aiming for:\nFormat (in person or online):\nDesired start date:\n"

  [[pillars.services]]
    title = "University teams and argumentation workshops"
    text = "Tournament preparation in British Parliamentary or World Schools format, and two-hour workshops."
    subject = "Debate coaching or argumentation workshop"
    body = "Institution or team:\nWhat you need (tournament preparation or a workshop):\nFormat (BP or World Schools):\nNumber of participants and level:\nDates and availability:\n"

  [[pillars.services]]
    title = "Advice on tournament adjudication and organisation"
    text = "The judging team, assessment criteria and how the rounds are organised."
    subject = "Debate tournament advice (adjudication and organisation)"
    body = "Organisation or tournament:\nTournament date:\nFormat:\nNumber of teams and adjudicators (and their experience):\n"

[[pillars]]
  id = "consulting"
  name = "Consulting and data analysis"
  title = "Applied research for institutions"
  intro = "I design and analyse studies for institutions with mixed methods, quantitative and qualitative, documenting every methodological decision."
  home_title = "Applied research for institutions"
  home_text = "Surveys, administrative records and interviews, with quantitative and qualitative methods."
  home_cta = "Email me about a project"

  [[pillars.services]]
    title = "Electoral and public-opinion analysis"
    text = "From a one-off question to a full report, with methods and limitations stated."
    subject = "Consulting: data analysis"
    body = "Organisation:\nWhat you need analysed or assessed:\nData available:\nDeadline:\n"

  [[pillars.services]]
    title = "Methods support and indicator validity"
    text = "An independent review of datasets and indicators before they are published."
    subject = "Methods support - indicator validity"
    body = "Organisation:\nReport or indicators in preparation:\nData source:\nPlanned publication date:\n"

  [[pillars.services]]
    title = "Data and visualisation in R"
    text = "Scattered sources integrated into one documented dataset, with publication-ready figures."
    subject = "Data analysis and visualisation in R"
    body = "Organisation:\nData sources:\nWhat you need (dataset, figures, report):\nDeadline:\n"

