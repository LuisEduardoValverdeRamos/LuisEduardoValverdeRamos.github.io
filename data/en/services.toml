# Work with me (/work-with-me/): a shorter version of the Spanish page, from the
# same structure. A service or note with confirmar = "…" waits for Luis: it shows
# only in local previews, marked, and is never published in production.
# Top-level keys first: in TOML, anything below a table header belongs to it.

title = "How I can help"
lead = "Alongside my research, I take on projects in five areas. Email me with what you need: I reply within 24 hours."
router_label = "What do you need?"

