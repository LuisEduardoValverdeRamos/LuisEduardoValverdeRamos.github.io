# Página CV (/es/cv/): las dos versiones del CV en PDF, cada una con su
# miniatura y su botón. El CV se escribe en LaTeX (tools/cv/cv-es.tex y
# cv-en.tex) y se publica con tools/cv/build.py, que también anota en
# data/cvfiles.toml las páginas y la fecha de cada PDF.
# Sin teléfono, dirección, DNI ni referencias (las referencias, a solicitud).
# Claves sueltas arriba: en TOML, todo lo que va debajo de una tabla queda dentro de ella.

title = "Currículum"
lead = "Mi CV en español y en inglés. Las dos versiones tienen el mismo contenido."
meta = "%d páginas · PDF · actualizado en %s"
view = "Abrir en el navegador"
contents_label = "Contenido"
contents = ["Perfil", "Formación", "Experiencia en investigación", "Consultoría", "Docencia", "Dirección y entrenamiento de debate", "Publicaciones e informes", "Reconocimientos y becas", "Medios y paneles", "Cursos", "Métodos, herramientas e idiomas"]
refs = "Las referencias, a solicitud:"

# Una tarjeta por idioma, en este orden
[[files]]
  lang = "es"
  name = "Español"
  download = "Descargar en español"
[[files]]
  lang = "en"
  name = "English"
  download = "Descargar en inglés"
