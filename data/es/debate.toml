[lpde]
  title = "Liga Peruana de Debate Escolar"
  text = "Desde septiembre de 2026 soy director académico de la LPDE: lidero el equipo a cargo de sus programas de capacitación, entrenamiento y consultoría en debate escolar. Antes, como consultor de investigación, preparé el primer informe de la Liga sobre el ecosistema de debate escolar (70 instituciones) y siete policy briefs. Trabajo solo con datos agregados: los debatientes son menores de edad."

