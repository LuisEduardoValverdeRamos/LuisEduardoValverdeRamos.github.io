[[highlights]]
  label = "MED · Panamá 2026"
  text = "Integré el equipo de entrenadores de la selección peruana que obtuvo su cuarto título consecutivo del Mundial de Debate Escolar en Español; mi equipo llegó a cuartos de final y sus tres debatientes figuraron entre los mejores oradores del torneo."
  src = "Andina ↗"
  url = "https://andina.pe/agencia/noticia-peru-se-corona-tetracampeon-el-mundial-debate-escolar-espanol-2026-1091241.aspx"

[[highlights]]
  label = "CMUDE · 2025–2026"
  text = "Preparé a las duplas dominicanas que llegaron a cuartos de final del Campeonato Mundial Universitario de Debate en Español (Ecuador 2026) y, en 2025, a la primera dupla íntegramente dominicana en alcanzar octavos de final."

[[highlights]]
  label = "CNDI 2025"
  text = "Campeón nacional interuniversitario de debate, como debatiente."

[[highlights]]
  label = "Adjudicación internacional"
  text = "He integrado equipos de adjudicación de torneos escolares y universitarios en Costa Rica, Ecuador, Perú y Venezuela: juez de la Gran Final del CMUDE 2026 y jefe de adjudicación del TNDE 2025."

