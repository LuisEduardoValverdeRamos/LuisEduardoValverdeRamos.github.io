# Página Debate (/es/debate/) y banda de debate de la portada.
# Reglas: los logros de equipo se rotulan como del equipo («la selección que
# entrené», «las duplas que preparé»); MED, CMUDE y WUDC con su nombre
# completo; nada individual de debatientes escolares (son menores de edad).
# Claves sueltas arriba: en TOML, todo lo que va debajo de una tabla queda dentro de ella.

lead = "Entreno equipos escolares y universitarios, juzgo torneos en español y dirijo el equipo académico de la Liga Peruana de Debate Escolar (LPDE)."
glossary = "El MED es el Mundial de Debate Escolar en Español; el CMUDE, el Campeonato Mundial Universitario de Debate en Español, y el WUDC, el Mundial Universitario de Debate, que se compite en inglés."

