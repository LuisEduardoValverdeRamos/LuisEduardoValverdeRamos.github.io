# Página Debate (/es/debate/) y banda de debate de la portada.
# Reglas: los logros de equipo se rotulan como del equipo («la selección que
# entrené», «las duplas que preparé»); MED y CMUDE con su nombre completo;
# nada individual de debatientes escolares (son menores de edad).
# Correcciones de Luis (17-oct-2026): no entrenó equipos en el WUDC, solo en el
# CMUDE, y nunca fue director académico de la LPDE (fue consultor, feb.–ago. 2026).
# Correcciones de Luis (18-oct-2026): la selección opera con un staff de entrenadores
# y cada uno prepara a un equipo de la delegación (su equipo: cuartos de final en
# Panamá 2026, tres debatientes entre los mejores oradores; también entrenó para el
# MED de Chile 2025); es COentrenador general de la Sociedad de Debate PUCP; el
# jueceo suelto no vende: lo que posiciona son los equipos de adjudicación en
# torneos escolares y universitarios de Costa Rica, Ecuador, Perú y Venezuela; en
# 2025 preparó a la primera dupla íntegramente dominicana en octavos del CMUDE.
# Claves sueltas arriba: en TOML, todo lo que va debajo de una tabla queda dentro de ella.

lead = "Dirijo la Selección Nacional de Debate Escolar del Perú, entreno equipos escolares y universitarios y he integrado equipos de adjudicación en torneos de Costa Rica, Ecuador, Perú y Venezuela."

# Portada: una banda de una línea, aparte del perfil de investigación y
# consultoría: las organizaciones de los cargos de [coach] con home = true.
[home]
  title = "Debate"
  more = "Ver debate"

# Página: el cargo de director va destacado arriba (texto confirmado por Luis el
# 11-nov-2026); en la lista de entrenamiento no se repite (featured = true).
[director]
  label = "Desde 2026"
  title = "Director general de la Selección Nacional de Debate Escolar del Perú"
  text = "Dirijo la convocatoria de la selección, coordino con los encargados de las selecciones junior y senior y represento a la selección ante la organización del Mundial de Debate Escolar en Español (MED)."

[labels]
  trajectory = "Trayectoria"

# Resultados: label (lugar y año), title (nombre completo del torneo, con la
# sigla que usan las listas de abajo), text y fuente opcional.
[[highlights]]
  label = "Panamá 2026"
  title = "Mundial de Debate Escolar en Español (MED)"
  text = "Integré el equipo de entrenadores de la selección peruana que obtuvo su cuarto título consecutivo; el equipo que entrené llegó a cuartos de final y quedó entre los 10 mejores oradores del torneo."
  src = "Andina ↗"
  url = "https://andina.pe/agencia/noticia-peru-se-corona-tetracampeon-el-mundial-debate-escolar-espanol-2026-1091241.aspx"

[[highlights]]
  label = "República Dominicana 2025 · Ecuador 2026"
  title = "Campeonato Mundial Universitario de Debate en Español (CMUDE)"
  text = "Preparé a las duplas dominicanas que llegaron a cuartos y a octavos de final; en 2025, la primera dupla íntegramente dominicana en llegar a octavos."

