# Página Debate (/es/debate/) y banda de debate de la portada.
# Reglas: los logros de equipo se rotulan como del equipo («la selección que
# entrené», «las duplas que preparé»); MED y CMUDE con su nombre completo;
# nada individual de debatientes escolares (son menores de edad).
# Correcciones de Luis (17-oct-2026): no entrenó equipos en el WUDC, solo en el
# CMUDE, y nunca fue director académico de la LPDE (fue consultor, feb.–ago. 2026).
# Correcciones de Luis (18-oct-2026): la selección opera con un staff de entrenadores
# y cada uno prepara a un equipo de la delegación (su equipo: cuartos de final en
# Panamá 2026, tres debatientes entre los mejores oradores; también entrenó para el
# MED de Chile 2025); es COentrenador general de la Sociedad de Debate PUCP; el
# jueceo suelto no vende: lo que posiciona son los equipos de adjudicación en
# torneos escolares y universitarios de Costa Rica, Ecuador, Perú y Venezuela; en
# 2025 preparó a la primera dupla íntegramente dominicana en octavos del CMUDE.
# Claves sueltas arriba: en TOML, todo lo que va debajo de una tabla queda dentro de ella.

lead = "Dirijo la Selección Nacional de Debate Escolar del Perú, entreno equipos escolares y universitarios y he integrado equipos de adjudicación en torneos de Costa Rica, Ecuador, Perú y Venezuela."
glossary = "El MED es el Mundial de Debate Escolar en Español, y el CMUDE, el Campeonato Mundial Universitario de Debate en Español."

[home]
  eyebrow = "Debate"
  title = "Entreno equipos escolares y universitarios, y formo jueces de debate"
  text = "Director general de la Selección Nacional de Debate Escolar del Perú, coentrenador general de la Sociedad de Debate PUCP y entrenador del Colegio Alpamayo; he integrado equipos de adjudicación en torneos de Costa Rica, Ecuador, Perú y Venezuela."
