[[lines]]
  id = "comportamiento-electoral"
  name = "Comportamiento electoral"
  question = "¿Cómo vota la gente cuando los partidos no existen?"
  summary = "Encuestas postelectorales, clustering y modelos de elección discreta. Integré el equipo técnico del informe del JNE y ProDiálogo sobre el elector peruano (2026) y preparo un artículo con Daniel Encinas (Northwestern University)."
  method = "Encuestas postelectorales del JNE (2011, 2016 y 2021), análisis de conglomerados, modelos de elección discreta y análisis espacial del padrón."
  evidence = "Informe del JNE y ProDiálogo (2026), como parte del equipo técnico; proyecto Voto Joven 2026; artículo en preparación con Daniel Encinas."
  status = "Activa"

[[lines]]
  id = "prensa-y-agenda"
  name = "Prensa y agenda pública"
  question = "¿Qué decide nombrar la prensa, y qué calla?"
  summary = "Como asistente de investigación en CISEPA-PUCP trabajé en la construcción de un corpus de 747,836 titulares de El Comercio y La República (2016–2024). Es una línea en desarrollo."
  method = "Análisis de texto a escala sobre un corpus de 747,836 titulares de El Comercio y La República (2016–2024), construido como asistente de investigación en CISEPA-PUCP."
  evidence = "Aún sin publicaciones propias."
  status = "En desarrollo"

[[lines]]
  id = "implementacion"
  name = "Implementación de políticas"
  question = "¿Por qué lo que el Estado promete llega tarde o no llega?"
  summary = "Mi tesis estudió la reconstrucción de la infraestructura educativa de Piura tras El Niño Costero (2020–2023). Como asistente de investigación en Q-LAB-PUCP trabajé en un modelo de machine learning sobre retrasos en obras municipales."
  method = "Estudio de caso con comparación y entrevistas (tesis); modelo de machine learning (XGBoost y SHAP) sobre obras municipales, como asistente en Q-LAB-PUCP."
  evidence = "Tesis con mención sobresaliente (PUCP, 2025); sitio y código público del proyecto de obras municipales."
  status = "Activa"

[[lines]]
  id = "educacion-civica"
  name = "Educación cívica y debate"
  question = "¿Qué forma a ciudadanos capaces de deliberar?"
  summary = "Para la LPDE analicé en agregado los resultados públicos del debate escolar (2026), y para la ESEG participo en un censo de la enseñanza electoral universitaria (en curso)."
  method = "Analítica de resultados públicos de torneos escolares, siempre en agregado; censo de la enseñanza electoral universitaria (ESEG-JNE)."
  evidence = "Informe y policy briefs de la LPDE (2026). El censo de la ESEG está en curso y aún no tiene resultados publicables."
