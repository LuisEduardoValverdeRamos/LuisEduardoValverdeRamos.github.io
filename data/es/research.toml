[[lines]]
  id = "comportamiento-electoral"
  name = "Comportamiento electoral"
  question = "¿Cómo votan las personas en sistemas de partidos débiles?"
  summary = "Encuestas postelectorales, clustering y modelos de elección discreta. Integré el equipo técnico del informe del JNE y ProDiálogo sobre el elector peruano (2026)."
  method = "Encuestas postelectorales del JNE (2011, 2016 y 2021), análisis de conglomerados, modelos de elección discreta y análisis espacial del padrón."
  evidence = "Informe del JNE y ProDiálogo (2026), como parte del equipo técnico; proyecto Voto Joven 2026."

[[lines]]
  id = "implementacion"
  name = "Implementación de políticas"
  question = "¿Qué explica las brechas de implementación de las políticas públicas?"
  summary = "Mi tesis estudió la reconstrucción de la infraestructura educativa de Piura tras El Niño Costero de 2017 (2020–2023). Como asistente de investigación en Q-LAB-PUCP trabajé en un modelo de machine learning sobre retrasos en obras municipales."
  method = "Estudio de caso con comparación y entrevistas (tesis); modelo de machine learning (XGBoost y SHAP) sobre obras municipales, como asistente en Q-LAB-PUCP."
  evidence = "Tesis con mención sobresaliente (PUCP, 2025); sitio y código público del proyecto de obras municipales."

[[lines]]
  id = "analisis-legislativo"
  name = "Comportamiento legislativo"
  question = "¿Cómo votan los congresistas y sus bancadas en el Perú?"
  summary = "Línea en desarrollo: estudio el comportamiento de las bancadas y las reformas de educación superior y de minería en el Congreso. Para el portal cívico hechosynopalabras.pe (GIES-PUCP) sistematicé votaciones nominales y seguimiento de proyectos de ley."
  method = "Scraping y sistematización de proyectos de ley y votaciones nominales del Congreso peruano (2021–2026); bases de datos documentadas y análisis en R."
  evidence = "Portal cívico hechosynopalabras.pe, del Grupo de Investigación en Estado y Sociedad (GIES-PUCP)."
  status = "En desarrollo"

# En curso: proyectos propios en desarrollo (12-nov-2026). Dos etiquetas:
# «Working paper» para los artículos y «En curso» para los estudios de la ESEG.
# Sin resultados, sin fuente de datos y sin coautores. El artículo sobre la
# SUNEDU NO va: está en evaluación a doble ciego.
[[wip]]
  title = "Votar en contra: el contenido expresivo del voto en el balotaje peruano de 2021"
  with = "Cómo decidieron los electores en la segunda vuelta presidencial de 2021: a favor de un candidato, en contra del otro o por ninguno."
  status = "Working paper"

[[wip]]
  title = "Brechas de implementación en la obra pública municipal del Perú, 2018–2024"
  with = "Qué características de las obras y de las municipalidades se asocian con retrasos en la ejecución, con modelos de machine learning. Retoma el proyecto iniciado en Q-LAB-PUCP."
  status = "Working paper"

[[wip]]
  title = "Una agenda de investigación para la Escuela Electoral y de Gobernabilidad"
  with = "Estudio de métodos mixtos para proponer las líneas de investigación de la Escuela: análisis de su producción institucional, consulta a especialistas y entrevistas."
  status = "En curso"

[[wip]]
  title = "La materia electoral en la formación universitaria peruana"
  with = "Estudio descriptivo de los cursos sobre temas electorales en las carreras de pregrado y los programas de posgrado del país, para la ESEG del JNE."
  status = "En curso"

