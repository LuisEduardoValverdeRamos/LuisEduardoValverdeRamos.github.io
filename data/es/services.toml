# Página Trabajemos (/es/trabajemos/) y extractos de la portada.
# Dos pilares, en este orden: investigación y consultoría. El de debate salió el
# 11-nov-2026 (perfil de académico y consultor): sus servicios están en
# data/es/debate.toml ([[team.services]]) y aquí queda solo la línea [debate],
# que remite a esa página. (Talleres de R, prensa, «Cómo trabajo», «Lo que no
# hago», las filas Entregas y Lo que no prometo y la ficha de revisión
# metodológica se retiraron el 28-oct-2026.)
# Cada pilar es una tarjeta (11-nov-2026) y sus servicios, filas cortas: title,
# text (una línea), subject (asunto del correo) y body (cuerpo del correo). Las
# instituciones van en una línea, la misma banda de la portada (home_line). Un servicio con
# confirmar = "…" espera el visto bueno de Luis: solo se ve, marcado, en la
# vista previa local; en producción no se publica.
# Claves sueltas arriba: en TOML, todo lo que va debajo de una tabla queda dentro de ella.

title = "Cómo puedo ayudarte"
lead = "Colaboro en investigaciones y hago investigación aplicada para instituciones. Escríbeme con lo que necesitas."
cv_label = "Ver mi CV"

[labels]
  write = "Escribir sobre esto"

[home]
  title = "En qué puedo ayudarte"
  more = "Ver todos los servicios"
  pillars = ["consultoria", "investigacion"]

# Línea final de Trabajemos que remite a la página de Debate (#team)
[debate]
  text = "¿Buscas entrenamiento de debate o asesoría para un torneo?"
  label = "Ver en Debate"

# ── 1 · Investigación ─────────────────────────────────────────────────────────
[[pillars]]
  id = "investigacion"
  name = "Investigación"
  page = "/research"
  page_label = "Mi investigación"
  title = "Colaboración y asistencia de investigación"
  intro = "Colaboro en proyectos sobre comportamiento electoral, política subnacional, implementación de políticas y análisis legislativo."
  home_title = "Colaboración en investigación"
  home_text = "Coautorías, asistencia de investigación, construcción de bases de datos y apoyo metodológico."
  home_cta = "Proponer una colaboración"

  [[pillars.services]]
    title = "Colaboración y coautoría"
    text = "Trabajo en artículos y proyectos desde el diseño hasta la redacción, con roles y autoría acordados al inicio."
    subject = "Colaboración de investigación"
    body = "Tema y pregunta:\nEstado del proyecto:\nDatos:\nRol que imaginas para mí:\n"

  [[pillars.services]]
    title = "Asistencia de investigación"
    text = "Apoyo la recolección, el procesamiento y el análisis de datos, y la revisión de literatura."
    subject = "Asistencia de investigación"
    body = "Proyecto e institución:\nTareas:\nHoras por semana y duración:\n"

# ── 2 · Consultoría ───────────────────────────────────────────────────────────
[[pillars]]
  id = "consultoria"
  name = "Consultoría"
  title = "Investigación aplicada para instituciones"
  intro = "Diseño y analizo estudios para instituciones con métodos mixtos."
  home_title = "Investigación aplicada para instituciones"
  home_text = "Encuestas, registros administrativos y entrevistas, con métodos cuantitativos y cualitativos."
  home_cta = "Escríbeme sobre un proyecto"

  [[pillars.services]]
    title = "Análisis electoral y de opinión pública"
    text = "Analizo encuestas, resultados electorales y datos del padrón, desde una consulta puntual hasta un informe completo."
    subject = "Análisis electoral o de opinión pública"
    body = "Organización:\nPregunta que quieren responder:\nDatos disponibles (resultados, padrón, encuesta):\nPlazo:\nUso previsto del análisis:\n"

  [[pillars.services]]
    title = "Acompañamiento metodológico y validez de indicadores"
    text = "Reviso la calidad de bases de datos e indicadores antes de su publicación."
    subject = "Acompañamiento metodológico - validez de indicadores"
    body = "Organización:\nInforme o indicadores en preparación:\nFuente de datos:\nFecha de publicación prevista:\n"

  [[pillars.services]]
    title = "Datos y visualización en R"
    text = "Construyo bases de datos con registros administrativos y fuentes públicas, y preparo sus gráficos y tablas."
    subject = "Análisis de datos y visualización en R"
    body = "Organización:\nFuentes de datos:\nProducto que necesitan (base, figuras, informe):\nPlazo:\n"

[institutions]
  home_label = "He trabajado con"
  home_line = "JNE (ESEG) · PUCP (Q-LAB, CISEPA, IDEHPUCP) · ProDiálogo · Colegio de Abogados de Lima (Observatorio de Corrupción) · Liga Peruana de Debate Escolar · Roche Pharma Perú (vía Sapienza Consultora)"
