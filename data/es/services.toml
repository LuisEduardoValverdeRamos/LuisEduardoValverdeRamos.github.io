# Página Trabajemos (/es/trabajemos/) y extractos de la portada y de Debate.
# Tres pilares, en este orden: investigación, debate y consultoría (talleres de
# R, prensa, «Cómo trabajo», «Lo que no hago», las filas Entregas y Lo que no
# prometo y la ficha de revisión metodológica se retiraron el 28-oct-2026).
# Cada servicio: title, for, format, subject (asunto del correo) y body
# (cuerpo del correo); sin fila de Experiencia por ficha (la banda del pilar de
# Debate y el bloque de Instituciones sustentan). Un servicio o una línea con
# confirmar = "…" espera el visto bueno de Luis: solo se ve, marcado, en la
# vista previa local; en producción no se publica.
# Claves sueltas arriba: en TOML, todo lo que va debajo de una tabla queda dentro de ella.

title = "Cómo puedo ayudarte"
