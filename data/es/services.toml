# ── 1 · Investigación y papers ────────────────────────────────────────────────
[[pillars]]
  id = "investigacion"
  name = "Investigación y papers"
  page = "/research"
  page_label = "Mi investigación"
  title = "Colaboración y asistencia de investigación"
  intro = "Colaboro en proyectos sobre comportamiento electoral, política subnacional, implementación de políticas y análisis legislativo."
  limit = "No escribo tesis, artículos ni trabajos por encargo para que otra persona los presente como propios. Reviso, explico y enseño; el texto y las decisiones son de quien firma."
  home_title = "Colaboración en investigación"
  home_text = "Coautorías, asistencia de investigación, construcción de bases de datos y apoyo metodológico."
  home_cta = "Proponer una colaboración"

  [[pillars.services]]
    title = "Colaboración y coautoría"
    for = "Investigadoras e investigadores que trabajan sobre el Perú o América Latina en estos temas."
    format = "Roles acordados al inicio según la taxonomía CRediT: datos, análisis, software, visualización y redacción."
    subject = "Colaboración de investigación"
    body = "Tema y pregunta:\nEstado del proyecto:\nDatos:\nRol que imaginas para mí:\n"

  [[pillars.services]]
    title = "Asistencia de investigación"
    for = "Investigadores y centros que necesitan construir bases, hacer análisis econométrico replicable en R o revisar literatura."
    format = "Por proyecto y a distancia."
    subject = "Asistencia de investigación"
    body = "Proyecto e institución:\nTareas:\nHoras por semana y duración:\n"

# ── 2 · Debate ────────────────────────────────────────────────────────────────
[[pillars]]
  id = "debate"
  name = "Debate"
  page = "/debate"
  page_label = "Mi trayectoria en debate"
  title = "Entrenamiento de equipos y asesoría de torneos"
  intro = "Entreno equipos escolares y universitarios en formato World Schools y parlamentario británico, y asesoro en la adjudicación y organización de torneos."
  proof = "Director general de la Selección Nacional de Debate Escolar del Perú y, antes, parte de su equipo de entrenadores: en Panamá 2026 la selección obtuvo su cuarto título consecutivo del Mundial de Debate Escolar en Español (MED) y mi equipo llegó a cuartos de final. Preparé a las duplas dominicanas que llegaron a cuartos y a octavos de final del CMUDE Ecuador 2026."
  home_title = "Entrenamiento de equipos y asesoría de torneos"
  home_text = "Colegios, universidades y selecciones: preparación de equipos y asesoría en la adjudicación y organización de torneos."
  home_cta = "Entrenar a mi equipo"

  [[pillars.services]]
    title = "Programa de debate para colegios"
    for = "Colegios que quieren empezar un club de debate o preparar a su equipo para torneos escolares."
    format = "Programa semestral o anual, presencial en Lima o remoto; la frecuencia de las sesiones se acuerda con el colegio."
    subject = "Programa de debate para colegio"
    body = "Colegio:\nCiudad:\nGrados y número de estudiantes:\n¿Ya tienen club de debate?:\nTorneos a los que apuntan:\nModalidad (presencial o remota):\nFecha de inicio deseada:\n"

  [[pillars.services]]
    title = "Equipos universitarios y talleres de argumentación"
    for = "Sociedades de debate y selecciones que preparan un torneo, y colegios, universidades y organizaciones que quieren una introducción práctica al debate."
    format = "Ciclo de preparación antes del torneo, en formato parlamentario británico o World Schools, o taller de 2 horas; presencial en Lima o remoto."
    subject = "Coaching de debate o taller de argumentación"
    body = "Institución o equipo:\nQué necesitas (preparación para un torneo o taller):\nFormato (BP o World Schools):\nNúmero de participantes y nivel:\nFechas y disponibilidad:\n"

  [[pillars.services]]
    title = "Asesoría en adjudicación y organización de torneos"
    for = "Ligas, organizadores, universidades y colegios que preparan un torneo y quieren asesoría en su lado competitivo: equipo de jueces, criterios de evaluación y organización de las rondas."
    format = "Según el torneo: asesoría en el diseño del equipo de adjudicación y en la organización, taller «¿Cómo se evalúa un debate?» y, antes del torneo, una sesión de calibración con rondas de ejemplo."
    subject = "Asesoría de torneo de debate (adjudicación y organización)"
    body = "Organización o torneo:\nFecha del torneo:\nFormato:\nNúmero de equipos y de jueces (y su experiencia):\n"

# ── 3 · Consultoría y análisis ────────────────────────────────────────────────
[[pillars]]
  id = "consultoria"
  name = "Consultoría y análisis"
  title = "Investigación aplicada para instituciones"
  intro = "Diseño y analizo estudios para instituciones con métodos mixtos —cuantitativos y cualitativos—, documentando cada decisión metodológica."
  home_title = "Investigación aplicada para instituciones"
  home_text = "Encuestas, registros administrativos y entrevistas, con métodos cuantitativos y cualitativos."
  home_cta = "Escríbeme sobre un proyecto"

  [[pillars.services]]
    title = "Análisis electoral y de opinión pública"
    for = "ONG, centros de investigación, cooperación internacional y medios con unidad de datos."
    format = "Por encargo, con el alcance acordado al inicio: desde una consulta puntual sobre una base hasta un informe con figuras."
    subject = "Análisis electoral o de opinión pública"
    body = "Organización:\nPregunta que quieren responder:\nDatos disponibles (resultados, padrón, encuesta):\nPlazo:\nUso previsto del análisis:\n"

  [[pillars.services]]
    title = "Acompañamiento metodológico y validez de indicadores"
    for = "Observatorios, ONG y áreas de estudios que van a publicar indicadores construidos con datos administrativos."
    format = "Revisión de la base y de cada indicador, con sesiones de trabajo con el equipo."
    subject = "Acompañamiento metodológico - validez de indicadores"
    body = "Organización:\nInforme o indicadores en preparación:\nFuente de datos:\nFecha de publicación prevista:\n"

  [[pillars.services]]
    title = "Datos y visualización en R"
    for = "Equipos que trabajan con registros del MEF, el INEI, el MINEDU, el SEACE o el BCRP y necesitan integrarlos, documentarlos y visualizarlos."
    format = "Proyecto por entregables. Trabajo en R; también uso Python y Stata, a nivel intermedio."
    subject = "Análisis de datos y visualización en R"
    body = "Organización:\nFuentes de datos:\nProducto que necesitan (base, figuras, informe):\nPlazo:\n"

