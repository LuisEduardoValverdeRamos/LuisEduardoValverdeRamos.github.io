# ── 1 · Debate ────────────────────────────────────────────────────────────────
[[pillars]]
  id = "debate"
  name = "Debate"
  title = "Entrenamiento de equipos y formación de jueces"
  intro = "Entreno equipos escolares y universitarios en formato World Schools y parlamentario británico, y formo jueces."
  proof = "Director general de la Selección Nacional de Debate Escolar del Perú y, antes, parte de su equipo de entrenadores: en Panamá 2026 la selección obtuvo su cuarto título consecutivo del Mundial de Debate Escolar en Español (MED) y mi equipo llegó a cuartos de final. Preparé a las duplas dominicanas que llegaron a cuartos de final del CMUDE Ecuador 2026."
  home_title = "Entrenamiento de equipos y jueces"
  home_text = "Colegios, universidades y selecciones: preparación de torneos y formación de jueces."
  home_cta = "Entrenar a mi equipo"

  [[pillars.services]]
    title = "Programa de debate para colegios"
    for = "Colegios que quieren empezar un club de debate o preparar a su equipo para torneos escolares."
    format = "Programa semestral o anual, presencial en Lima o remoto; la frecuencia de las sesiones se acuerda con el colegio."
    deliverables = "Plan de contenidos (argumentos, refutación, ponderación y fundamentos de economía), sesiones con retroalimentación individual, calendario de torneos sugerido e informe de cierre."
    proof = "Entrenador de debate del Colegio Alpamayo desde junio de 2026; director general de la Selección Nacional de Debate Escolar del Perú, donde integré el equipo de entrenadores (2025–2026)."
    subject = "Programa de debate para colegio"
    body = "Colegio:\nCiudad:\nGrados y número de estudiantes:\n¿Ya tienen club de debate?:\nTorneos a los que apuntan:\nModalidad (presencial o remota):\nFecha de inicio deseada:\n"
    nopromise = "Títulos, clasificaciones ni un lugar en la selección. No publico nombres, datos ni imágenes de estudiantes sin autorización escrita del colegio y de las familias."

  [[pillars.services]]
    title = "Equipos universitarios y selecciones"
    for = "Sociedades de debate y selecciones que preparan el CMUDE, un campeonato nacional u otros torneos en formato parlamentario británico."
    format = "Ciclo de preparación antes del torneo, remoto, en formato parlamentario británico o World Schools."
    deliverables = "Plan de preparación, sesiones con mociones y retroalimentación, material de contenido por área temática."
    proof = "Duplas de República Dominicana: la primera dupla íntegramente dominicana en llegar a octavos de final del CMUDE (2025) y cuartos de final en Ecuador 2026. Coentrenador general de la Sociedad de Debate PUCP."
    subject = "Coaching de debate - universidad o selección"
    body = "Institución o equipo:\nFormato (BP o World Schools):\nTorneo objetivo y fecha:\nNúmero de debatientes y nivel:\nZona horaria y disponibilidad:\n"
    nopromise = "Pasar a rondas eliminatorias. Tampoco acompaño a un equipo en un torneo donde soy juez o formo parte de la adjudicación."

  [[pillars.services]]
    title = "Formación de jueces"
    for = "Ligas, organizadores de torneos, universidades y colegios que necesitan jueces con criterios comunes."
    format = "Taller de 2 horas «¿Cómo se evalúa un debate?» y, antes del torneo, una sesión de calibración con rondas de ejemplo."
    deliverables = "Materiales del taller, guía de evaluación por formato y ejercicios de calibración."
    proof = "He integrado equipos de adjudicación de torneos escolares y universitarios en Costa Rica, Ecuador, Perú y Venezuela; juez de la Gran Final del CMUDE 2026 (Ecuador) y jefe de adjudicación del TNDE 2025."
    subject = "Formación de jueces de debate"
    body = "Organización o torneo:\nFecha del torneo:\nNúmero de jueces y experiencia:\nFormato:\n"
    nopromise = "Acreditaciones o certificados a título personal: solo los emite una liga o institución."

  [[pillars.services]]
    title = "Talleres de argumentación"
    for = "Colegios, universidades, docentes y organizaciones que quieren una introducción práctica al debate."
    format = "2 horas, presencial o remoto: argumentos de principios, refutación y ponderación, o cómo se evalúa un debate."
    deliverables = "Diapositivas, guía de ejercicios y mociones del taller."
    proof = "Instructor de novatos de la Sociedad de Debate PUCP (2025) y programa del Colegio Alpamayo."
    subject = "Taller de debate (2 horas)"
    body = "Institución:\nPúblico (edades y número):\nTema de interés:\nFecha tentativa:\nModalidad:\n"

# ── 2 · Consultoría y análisis ────────────────────────────────────────────────
[[pillars]]
  id = "consultoria"
  name = "Consultoría y análisis"
  title = "Datos electorales y administrativos para instituciones"
  intro = "Analizo datos para instituciones que necesitan responder una pregunta concreta, con métodos documentados y código reproducible en R."
  home_title = "Análisis electoral y de datos públicos"
  home_text = "Encuestas, padrones y bases administrativas, con método declarado y código en R."
  home_cta = "Escríbeme sobre un proyecto"

  [[pillars.services]]
    title = "Análisis electoral y de opinión pública"
    for = "ONG, centros de investigación, cooperación internacional y medios con unidad de datos."
    format = "Por encargo, con el alcance acordado al inicio: desde una consulta puntual sobre una base hasta un informe con figuras."
    deliverables = "Informe con metodología y limitaciones declaradas, figuras reproducibles, base documentada y scripts de R."
    proof = "Equipo técnico del informe «Análisis del elector peruano» (JNE y ProDiálogo, 2026); asistente de investigación de Daniel Encinas y Rodrigo Barrenechea sobre la geografía del voto (1980–2021)."
    subject = "Análisis electoral o de opinión pública"
    body = "Organización:\nPregunta que quieren responder:\nDatos disponibles (resultados, padrón, encuesta):\nPlazo:\nUso previsto del análisis:\n"
    nopromise = "Pronósticos de resultados, encuestas de intención de voto para difusión ni microsegmentación de votantes."

  [[pillars.services]]
    title = "Acompañamiento metodológico y validez de indicadores"
    for = "Observatorios, ONG y áreas de estudios que van a publicar indicadores construidos con datos administrativos."
    format = "Revisión de la base y de cada indicador, con sesiones de trabajo con el equipo."
    deliverables = "Matriz de factibilidad y validez por indicador; memorando con las decisiones metodológicas pendientes y sus consecuencias."
    proof = "Consultor del Observatorio de Corrupción del Colegio de Abogados de Lima desde septiembre de 2026, en su informe sobre contrataciones públicas (en curso)."
    subject = "Acompañamiento metodológico - validez de indicadores"
    body = "Organización:\nInforme o indicadores en preparación:\nFuente de datos:\nFecha de publicación prevista:\n"
    nopromise = "Avalar conclusiones ya decididas ni firmar como autor el informe de la institución."

  [[pillars.services]]
    title = "Datos y visualización en R"
    for = "Equipos que trabajan con registros del MEF, el INEI, el MINEDU, el SEACE o el BCRP y necesitan integrarlos, documentarlos y visualizarlos."
    format = "Proyecto por entregables. Trabajo en R; también uso Python y Stata, a nivel intermedio."
    deliverables = "Base integrada con diccionario de variables, scripts reproducibles, figuras listas para informe y nota de limitaciones."
    proof = "Sitio y código del proyecto de brechas en obras municipales, iniciado como asistente de investigación en Q-LAB-PUCP."
    subject = "Análisis de datos y visualización en R"
    body = "Organización:\nFuentes de datos:\nProducto que necesitan (base, figuras, informe):\nPlazo:\n"
    nopromise = "Aplicaciones en producción con mantenimiento ni administración de servidores."

# ── 3 · Investigación y papers ────────────────────────────────────────────────
[[pillars]]
  id = "investigacion"
  name = "Investigación y papers"
  title = "Colaboración, asistencia y revisión metodológica"
  intro = "Colaboro en proyectos sobre comportamiento electoral, política subnacional, implementación de políticas y educación electoral."
  limit = "No escribo tesis, artículos ni trabajos por encargo para que otra persona los presente como propios. Reviso, explico y enseño; el texto y las decisiones son de quien firma."
  home_title = "Colaboración y revisión metodológica"
  home_text = "Diseño, validez de indicadores y análisis en R. No escribo tesis ni papers por encargo."
  home_cta = "Proponer una colaboración"

  [[pillars.services]]
    title = "Colaboración y coautoría"
    for = "Investigadoras e investigadores que trabajan sobre el Perú o América Latina en estos temas."
    format = "Roles acordados al inicio según la taxonomía CRediT: datos, análisis, software, visualización y redacción."
    proof = "Tesis con mención sobresaliente (PUCP, 2025); equipo técnico del informe del JNE y ProDiálogo sobre el elector peruano (2026)."
    subject = "Colaboración de investigación"
    body = "Tema y pregunta:\nEstado del proyecto:\nDatos:\nRol que imaginas para mí:\n"
    nopromise = "Autorías sin contribución sustantiva: ni las pido ni las acepto."

  [[pillars.services]]
    title = "Asistencia de investigación"
    for = "Investigadores y centros que necesitan construir bases, hacer análisis econométrico replicable en R o revisar literatura."
    format = "Por proyecto y a distancia."
    deliverables = "Bases documentadas, scripts, tablas y figuras, y memos de resultados."
    proof = "Asistente de investigación en CISEPA-PUCP y Q-LAB-PUCP, y de Daniel Encinas y Rodrigo Barrenechea."
    subject = "Asistencia de investigación"
    body = "Proyecto e institución:\nTareas:\nHoras por semana y duración:\n"

  [[pillars.services]]
    title = "Revisión metodológica"
    for = "Tesistas y equipos que quieren una segunda lectura antes de entregar o enviar."
    format = "Lectura del documento, memorando escrito y una sesión para revisarlo."
    deliverables = "Memorando con observaciones priorizadas (pregunta, diseño, datos, método y reproducibilidad)."
    proof = "Jefe de práctica de Economía Política (PUCP); asistente docente de Introducción a R para la Investigación Social y de Causal Machine Learning (Q-LAB-PUCP)."
    subject = "Revisión metodológica"
    body = "Tipo de documento (tesis, proyecto, informe, manuscrito):\nEtapa:\nPregunta y método:\nFecha límite:\n"
    nopromise = "Redactar capítulos ni hacer el análisis para que otra persona lo firme. No trabajo con estudiantes de los cursos donde soy jefe de práctica."

