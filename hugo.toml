baseURL = 'https://luiseduardovalverderamos.github.io/'
languageCode = 'en-us'
title = 'Luis Valverde Ramos'
theme = "hugo-noir"

defaultContentLanguage = "en"

# Top-level keys must stay above the first [table]: in TOML, any key written
# below a table header belongs to that table and Hugo ignores it silently.
enableRobotsTXT = true
pluralizeListTitles = false
disableKinds = ["taxonomy", "term"]

[languages]

  [languages.en]
    languageName = "English"
    title = "Luis Valverde Ramos"
    weight = 1
    contentDir = "content/en"
    [languages.en.params]
      description = "Luis Valverde Ramos, political scientist (PUCP). Research on electoral behaviour and policy implementation in Peru; consulting and debate coaching."
    # Menu: the last item is the call to action (params.cta draws it as a button)
    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        pageRef = "/about"
        weight = 1
      [[languages.en.menu.main]]
        identifier = "research"
        name = "Research"
        pageRef = "/research"
        weight = 2
      [[languages.en.menu.main]]
        identifier = "debate"
        name = "Debate"
        pageRef = "/debate"
        weight = 3
      [[languages.en.menu.main]]
        identifier = "cv"
        name = "CV"
        pageRef = "/cv"
        weight = 4
      [[languages.en.menu.main]]
        identifier = "work"
        name = "Work with me"
        pageRef = "/work"
        weight = 5
        params = { cta = true }

  [languages.es]
    languageName = "Español"
    title = "Luis Valverde Ramos"
    weight = 2
    contentDir = "content/es"
    [languages.es.params]
      description = "Luis Valverde Ramos, politólogo (PUCP). Investigación sobre comportamiento electoral e implementación de políticas públicas en el Perú; consultoría y debate."
    [languages.es.menu]
      [[languages.es.menu.main]]
        identifier = "about"
        name = "Sobre mí"
        pageRef = "/about"
        weight = 1
      [[languages.es.menu.main]]
        identifier = "research"
        name = "Investigación"
        pageRef = "/research"
        weight = 2
      [[languages.es.menu.main]]
        identifier = "debate"
        name = "Debate"
        pageRef = "/debate"
        weight = 3
      [[languages.es.menu.main]]
        identifier = "cv"
        name = "CV"
        pageRef = "/cv"
        weight = 4
      [[languages.es.menu.main]]
        identifier = "work"
        name = "Trabajemos"
        pageRef = "/work"
        weight = 5
        params = { cta = true }

# Heading anchors without accents: «Qué investigo» → #que-investigo
[markup]
  [markup.goldmark.parser]
    autoHeadingIDType = "github-ascii"

[params]
  name = "Luis Valverde Ramos"
  location = "Lima, Perú"
  description = "Political Scientist (PUCP) | Mixed Methods | Electoral Politics · Public Policy"
  profile_image = "/images/profile.jpeg"
  # Social links
  github = "https://github.com/LuisEduardoValverdeRamos"
  linkedin = "https://www.linkedin.com/in/luisvalverderamos/"
  twitter = "https://x.com/LuisValverde06"
  email = "luis.valverde@pucp.edu.pe"

# Tailwind CSS is compiled by Hugo (css.TailwindCSS). Hugo writes the classes
# it sees to hugo_stats.json and Tailwind reads them from there.
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
  # Images are also assets, so templates can resize them (project thumbnails)
  [[module.mounts]]
    source = 'static/images'
    target = 'assets/images'
