baseURL = 'https://luiseduardovalverderamos.github.io/'
locale = 'en-us'
title = 'Luis Valverde Ramos'

defaultContentLanguage = "en"

# Top-level keys must stay above the first [table]: in TOML, any key written
# below a table header belongs to that table and Hugo ignores it silently.
enableRobotsTXT = true
pluralizeListTitles = false
disableKinds = ["taxonomy", "term"]

[languages]

  [languages.en]
    label = "English"
    locale = "en"
    title = "Luis Valverde Ramos"
    weight = 1
    contentDir = "content/en"
    [languages.en.params]
      description = "Luis Valverde Ramos, political scientist (PUCP). Research on electoral behaviour and policy implementation in Peru, and applied research for institutions."
    # Menu: the academic and consulting pages first, then Media and Debate, which
    # stand apart from the profile; CV leads to the page with both PDFs (the
    # hero button downloads the PDF directly, as on joseincio.com); the last
    # item is the call to action (params.cta draws it as a button)
    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        pageRef = "/about"
        weight = 1
      [[languages.en.menu.main]]
        identifier = "research"
        name = "Research"
        pageRef = "/research"
        weight = 2
      [[languages.en.menu.main]]
        identifier = "media"
        name = "Media"
        pageRef = "/media"
        weight = 3
      [[languages.en.menu.main]]
        identifier = "debate"
        name = "Debate"
        pageRef = "/debate"
        weight = 4
      [[languages.en.menu.main]]
        identifier = "cv"
        name = "CV"
        pageRef = "/cv"
        weight = 5
      [[languages.en.menu.main]]
        identifier = "work"
        name = "Work with me"
        pageRef = "/work"
        weight = 6
        params = { cta = true }

  [languages.es]
    label = "Español"
    locale = "es-PE"
    title = "Luis Valverde Ramos"
    weight = 2
    contentDir = "content/es"
    [languages.es.params]
      description = "Luis Valverde Ramos, politólogo (PUCP). Investigación sobre comportamiento electoral e implementación de políticas públicas en el Perú, e investigación aplicada para instituciones."
    [languages.es.menu]
      [[languages.es.menu.main]]
        identifier = "about"
        name = "Sobre mí"
        pageRef = "/about"
        weight = 1
      [[languages.es.menu.main]]
        identifier = "research"
        name = "Investigación"
        pageRef = "/research"
        weight = 2
      [[languages.es.menu.main]]
        identifier = "media"
        name = "Medios"
        pageRef = "/media"
        weight = 3
      [[languages.es.menu.main]]
        identifier = "debate"
        name = "Debate"
        pageRef = "/debate"
        weight = 4
      [[languages.es.menu.main]]
        identifier = "cv"
        name = "CV"
        pageRef = "/cv"
        weight = 5
      [[languages.es.menu.main]]
        identifier = "work"
        name = "Trabajemos"
        pageRef = "/work"
        weight = 6
        params = { cta = true }

# Heading anchors without accents: «Qué investigo» → #que-investigo. Block
# attributes let a paragraph take a class: {.s-current} in about.md.
[markup]
  [markup.goldmark.parser]
    autoHeadingIDType = "github-ascii"
    [markup.goldmark.parser.attribute]
      block = true

[params]
  name = "Luis Valverde Ramos"
  location = "Lima, Perú"
  description = "Political Scientist (PUCP) | Mixed Methods | Electoral Politics · Public Policy"
  profile_image = "/images/profile.jpeg"
  # Social links
  github = "https://github.com/LuisEduardoValverdeRamos"
  linkedin = "https://www.linkedin.com/in/luisvalverderamos/"
  twitter = "https://x.com/LuisValverde06"
  email = "luis.valverde@pucp.edu.pe"

# Tailwind CSS is compiled by Hugo (css.TailwindCSS). Hugo writes the classes
# it sees to hugo_stats.json and Tailwind reads them from there.
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
  # Images are also assets, so templates can resize them (project thumbnails)
  [[module.mounts]]
    source = 'static/images'
    target = 'assets/images'
