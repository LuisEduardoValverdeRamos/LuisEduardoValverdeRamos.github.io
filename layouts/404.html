{{ define "main" }}
<section class="w-full md:w-4/5 lg:w-3/5 mx-auto px-6 md:px-14 py-24">

    <h1 class="text-4xl md:text-5xl font-bold mb-6 text-text-primary-light dark:text-text-primary-dark">Página no encontrada <span class="block text-2xl md:text-3xl mt-2 text-text-secondary-light dark:text-text-secondary-dark">Page not found</span></h1>
    <p class="text-lg leading-relaxed text-text-secondary-light dark:text-text-secondary-dark mb-2" lang="es">La dirección que buscas no existe o cambió de lugar.</p>

    <div class="flex flex-wrap gap-3">
        <a href="{{ "es/" | absURL }}" lang="es" class="inline-flex items-center gap-2 px-4 py-2 rounded-md bg-accent-light dark:bg-accent-dark text-white dark:text-bg-primary-dark hover:opacity-90 transition-opacity text-sm font-medium">Ir a la portada</a>
        <a href="{{ "/" | absURL }}" lang="en" class="inline-flex items-center gap-2 px-4 py-2 rounded-md border border-accent-light dark:border-accent-dark text-accent-light dark:text-accent-dark text-sm font-medium">Go to the home page</a>

</section>
