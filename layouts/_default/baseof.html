<!DOCTYPE html>
<html lang="{{ .Language.Lang }}">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
        <meta name="description" content="{{ site.Params.description }}">

        <!-- Favicon -->
        <link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | absURL }}">

        <!-- Social sharing (Open Graph / Twitter) -->
        <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}">
        <meta property="og:description" content="{{ site.Params.description }}">
        <meta property="og:type" content="website">
        <meta property="og:url" content="{{ .Permalink }}">
        <meta property="og:image" content="{{ "images/profile.jpeg" | absURL }}">
        <meta name="twitter:card" content="summary">
        <meta name="twitter:image" content="{{ "images/profile.jpeg" | absURL }}">

        <!-- Fonts: Space Grotesk (display grotesque) + Inter (body) + IBM Plex Mono (data) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

        <!-- Theme: light-first ("Observatorio"). Dark only if the visitor chose it. -->
        <script>
            if (localStorage.getItem('color-theme') === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        </script>

        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['Inter', 'system-ui', 'sans-serif'],
                            serif: ['Space Grotesk', 'Inter', 'sans-serif'],
                            display: ['Space Grotesk', 'Inter', 'sans-serif'],
                            mono: ['IBM Plex Mono', 'ui-monospace', 'monospace'],
                        },
                        colors: {
                            /* ── Observatorio (light, default) ── */
                            'bg-primary-light': '#F7F6F2',
                            'bg-secondary-light': '#FFFFFF',
                            'bg-tertiary-light': '#ECEAE2',
                            'text-primary-light': '#111113',
                            'text-secondary-light': '#5B6473',
                            'border-primary-light': '#E3E1D9',
                            'border-secondary-light': '#D3D0C6',
                            'accent-light': '#1B45E0',
                            'accent2-light': '#243B6B',

                            /* ── Observatorio (dark, secondary) ── */
                            'bg-primary-dark': '#0E1014',
                            'bg-secondary-dark': '#15181E',
                            'bg-tertiary-dark': '#1C2029',
                            'text-primary-dark': '#E7E9EC',
                            'text-secondary-dark': '#9AA3B0',
                            'border-primary-dark': '#242A33',
                            'border-secondary-dark': '#333B46',
                            'accent-dark': '#6E8BFF',
                            'accent2-dark': '#9DB0D8',
                        },
                    },
                },
            };
        </script>

        <style>
            :root { color-scheme: light dark; }

            html, body {
                background-color: #F7F6F2;
                color: #111113;
                font-family: 'Inter', system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            html.dark, html.dark body {
                background-color: #0E1014;
                color: #E7E9EC;
            }

            /* Display grotesque for headings and the site name */
            h1, h2, h3, .site-name {
                font-family: 'Space Grotesk', Inter, sans-serif;
                letter-spacing: -0.02em;
            }

            ::selection {
                background: #1B45E0;
                color: #F7F6F2;
            }

            /* Mono metadata label — the "computational" signal */
            .mono-label {
                font-family: 'IBM Plex Mono', ui-monospace, monospace;
                font-size: 0.72rem;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                font-weight: 500;
            }
            .mono-data {
                font-family: 'IBM Plex Mono', ui-monospace, monospace;
                font-size: 0.8rem;
            }

            /* Section index prefix: "01 /" */
            .section-index {
                font-family: 'IBM Plex Mono', ui-monospace, monospace;
                font-size: 0.85rem;
                font-weight: 500;
                color: #1B45E0;
                margin-right: 0.6rem;
                vertical-align: 0.35em;
                letter-spacing: 0.05em;
            }
            html.dark .section-index { color: #6E8BFF; }

            /* ── Legacy utility remapping (old layouts use gray/blue utilities) ── */
            html:not(.dark) .text-gray-400 { color: #5B6473 !important; }
            html:not(.dark) .text-gray-500 { color: #6B7280 !important; }
            html:not(.dark) .bg-gray-700   { background-color: #D3D0C6 !important; }
            html:not(.dark) .border-gray-700 { border-color: #E3E1D9 !important; }
            html:not(.dark) .hover\:border-gray-400:hover { border-color: #1B45E0 !important; }

            /* Blue links → cobalt accent (both modes) */
            html:not(.dark) .text-blue-500, html:not(.dark) .text-blue-400 { color: #1B45E0 !important; }
            html:not(.dark) .hover\:text-blue-400:hover { color: #1536B8 !important; }
            html.dark .text-blue-500, html.dark .text-blue-400 { color: #6E8BFF !important; }
            html.dark .hover\:text-blue-400:hover { color: #9DB0D8 !important; }

            /* Timeline lines & dots in dark mode */
            html.dark .bg-gray-700 { background-color: #333B46 !important; }
            html.dark .border-gray-700 { border-color: #242A33 !important; }
        </style>
    </head>
    <body class="min-h-screen bg-bg-primary-light dark:bg-bg-primary-dark text-text-primary-light dark:text-text-primary-dark">
        {{ partial "header" . }}
        <main>
            {{ block "main" . }}{{ end }}
        </main>
        {{ partial "footer" . }}
    </body>
</html>
