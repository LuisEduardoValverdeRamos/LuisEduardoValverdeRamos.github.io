        (2016–2024), construido como asistente de investigación.
      en: >-
        Econometric support for political economy projects; manuscripts under review at
        international journals. Systematised media coverage of five illicit economies
        from a corpus of 747,836 headlines from El Comercio and La República (2016–2024),
        built as a research assistant.
    source: cv
  - cargo:
      es: "Consultor"
      en: "Consultant"
