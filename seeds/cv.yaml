# EN: borrador, revisar
perfil:
  es: >-
    Politólogo por la PUCP: primer puesto de su promoción, con tesis de licenciatura
    distinguida con mención sobresaliente. Investiga comportamiento electoral y política
    subnacional, prensa y agenda pública, y brechas de implementación en infraestructura
    pública, combinando métodos mixtos y ciencia social computacional en R. Investigador
    de la Escuela Electoral y de Gobernabilidad (ESEG) del Jurado Nacional de Elecciones
    y Director Académico de la Liga Peruana de Debate Escolar (LPDE). Entrenador de la
    selección peruana que en Panamá 2026 obtuvo su cuarto título consecutivo del Mundial
    de Debate Escolar en Español (MED); Campeón Nacional Interuniversitario de Debate
    (CNDI) 2025.
  en: >-
    Political scientist (PUCP): graduated first in his class, with an undergraduate
    thesis awarded the highest distinction. His research covers electoral behaviour and
    subnational politics, the press and the public agenda, and implementation gaps in
    public infrastructure, combining mixed methods and computational social science in R.
    Researcher at the Electoral and Governance School (ESEG) of Peru's National Elections
    Jury (JNE) and Academic Director of the Peruvian School Debate League (LPDE). Coach
    of the Peruvian national team that won its fourth consecutive title at the World
    Schools Debating Championship in Spanish (MED) in Panama 2026; national
    inter-university debate champion (CNDI 2025).

