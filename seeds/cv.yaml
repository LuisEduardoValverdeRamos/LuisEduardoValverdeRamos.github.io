    desde: "2025-11"
    hasta: "2025-12"
    detalle:
      es: >-
        Como parte del equipo técnico, contribuyó al diseño de tres instrumentos de
        análisis del comportamiento electoral para las Elecciones Generales 2026
        (Encuesta del Perfil Electoral, dos experimentos de encuesta y un mapa conductual
        del votante) y al clustering del electorado peruano sobre tres ciclos de
        encuestas (2011, 2016, 2021), insumo de las estrategias de educación cívica del JNE.
      en: >-
        As part of the technical team, contributed to the design of three instruments for
        analysing electoral behaviour ahead of the 2026 general elections (an electoral
        profile survey, two survey experiments and a behavioural map of the voter) and to
        the clustering of the Peruvian electorate across three survey cycles (2011, 2016,
        2021), an input for the JNE's civic education strategies.
